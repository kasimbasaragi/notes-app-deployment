apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: flask
          # CHANGE: your Docker Hub username, and the version tag you pushed
          image: YOUR_DOCKERHUB_USERNAME/notes-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
